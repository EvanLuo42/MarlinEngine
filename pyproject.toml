[project]
name = "marlin-engine"
version = "0.1.0"
description = "Marlin Engine toolkits"
readme = "README.md"
authors = [
    { name = "Evan Luo", email = "evanluo@cs.ucsb.edu" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
marlin = "marlin.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "marlin"
module-root = "Source/Programs/MarlinToolkit"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.92",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Rules classes declare list attributes on the class; each instance gets its own copy.
"*.{module,target,plugin}.py" = ["RUF012"]
